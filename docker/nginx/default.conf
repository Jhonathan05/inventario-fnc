server {
    listen 80;
    server_name localhost;

    # Solo se reenvían estas cabeceras si la petición entró por un proxy/túnel.
    # En acceso directo (localhost:3300) quedan vacías y nginx las omite, de
    # modo que Laravel usa el Host original sin alterar el puerto.
    set $fnc_forwarded_proto $http_x_forwarded_proto;
    set $fnc_forwarded_port $http_x_forwarded_port;
    if ($fnc_forwarded_proto = "https") {
        set $fnc_forwarded_port 443;
    }

    client_max_body_size 64M;

    gzip on;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        text/javascript
        image/svg+xml;

    location / {
        proxy_pass http://app:80;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fnc_forwarded_proto;
        proxy_set_header X-Forwarded-Port $fnc_forwarded_port;
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}